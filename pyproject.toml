[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novum"
version = "0.1.0"
description = "Onboard science data triage for a planetary rover: novelty scoring under a downlink and a compute budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NOVUM contributors" }]
keywords = ["novelty-detection", "mars", "mastcam", "onboard-autonomy", "downlink"]

# ---------------------------------------------------------------------------
# Base dependencies.
#
# ARCHITECTURAL RULE: this list is what `core/` and `api/` are allowed to use.
# It must never grow a training dependency (torch, scikit-learn, scipy, ...).
# `core/` is pure numpy so that the serving image can score frames without ever
# linking a training stack. See tests/test_no_training_deps.py, which fails the
# build if this rule is broken.
# ---------------------------------------------------------------------------
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  # Pure-python, ~30 KB: reports which BLAS is actually linked and how many
  # threads it runs -- recorded in every sidecar's environment block, because
  # those two knobs are what make "same code, different last digits" happen.
  "threadpoolctl>=3",
]

[project.optional-dependencies]
# Manifest/table IO. Needed by preprocess.py and sweep.py, not by the API.
data = [
  "pandas>=2.0",
  "pyarrow>=14.0",
]

# Training only. NEVER installed into the API image.
# NOTE: install torch from the CPU wheel index (see Makefile / Dockerfile.train)
# so no CUDA runtime is pulled in. NOVUM is CPU-only by design.
train = [
  "novum[data]",
  "torch>=2.2",
  "scikit-learn>=1.3",
]

# Serving only. Deliberately excludes every training dependency.
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
]

dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.urls]
Dataset = "https://doi.org/10.5281/zenodo.3732485"

[tool.setuptools]
packages = ["core", "core.models", "scripts", "api", "sim"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. Depends()/Header() in the
# signature IS the FastAPI dependency-injection idiom, not a mistake.
"api/*.py" = ["B008"]

# doctor.py is deliberately written in an older Python dialect: it has to run on
# whatever interpreter the box happens to have, in order to report that the
# interpreter is too old. The UP (pyupgrade) rules would modernise it into
# something that cannot parse there -- UP006/UP007 alone would require 3.9/3.10.
# Exempting the whole group keeps a future `ruff --fix` from breaking it.
"scripts/doctor.py" = ["UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:core.*"]
