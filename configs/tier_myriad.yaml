# =============================================================================
# Myriad X tier -- small convolutional autoencoder.
#
# STATUS: NOT IMPLEMENTED. This config is valid and parses; training it raises
# NotImplementedError from core/models/conv_ae.py. `make sweep` records the
# tier as `not_implemented` and continues.
#
# Represents a 1-2 W vision accelerator (Intel Myriad X class), the kind of
# part that has flown as a coprocessor rather than a flight computer.
# =============================================================================

tier: myriad
description: >
  Small conv autoencoder (16 channels, depth 2, latent 32) for a ~1-2 W VPU.
  Reconstruction MSE over typical terrain is the novelty score. NOT IMPLEMENTED.

seed: 0

model:
  type: conv_ae_myriad
  channels: 16
  depth: 2
  latent_dim: 32

  # Training hyperparameters, read once the tier is implemented.
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  device: cpu          # NOVUM is CPU-only by contract. Do not set to cuda.
  num_workers: 2
  early_stopping_patience: 5

transform:
  scale: 255.0
  downsample: 1        # convolutions consume the full 64x64 frame
  standardize: per_band
  frame_shape: [64, 64, 6]

data:
  train_split: train_typical
  max_train_samples: null
  chunk_size: 256

eval:
  typical_split: test_typical
  novel_split: test_novel_all
  k_values: [10, 25, 50, 100]
  per_class: true

compute:
  reference_processor: "Intel Myriad X VPU, ~1-2 W"
  cycles_per_flop: 0.25        # SIMD/VLIW: several MACs retire per cycle
  budget_cycles_per_frame: 100000000

downlink:
  bits_per_sample: 8
  compression_ratio: 4.0
  budget_bits_per_window: 8000000
